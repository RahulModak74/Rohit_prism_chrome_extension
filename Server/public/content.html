<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Gen Cyber Platform</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* Sidebar Styles */
        .sidebar {
            width: 80px;
            background-color: #007bff;
            color: white;
            padding: 15px;
            transition: width 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar.open {
            width: 250px;
        }

        .sidebar .dashboard-text {
            display: none;
            margin-bottom: 10px;
        }

        .sidebar.open .dashboard-text {
            display: block;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
            margin-top: 10px;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            margin: 15px 0;
            color: white;
            text-decoration: none;
            border: 2px solid white;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            transition: background-color 0.3s, width 0.3s;
        }

        .sidebar a:hover {
            background-color: #0056b3;
            border-color: #004085;
        }

        .sidebar i {
            margin-right: 10px;
            transition: margin-right 0.3s;
        }

        .sidebar.closed i {
            margin-right: 0;
        }

        .sidebar .link-text {
            transition: opacity 0.3s, width 0.3s;
            white-space: nowrap;
            overflow: hidden;
            opacity: 0;
            width: 0;
        }

        .sidebar.open .link-text {
            opacity: 1;
            width: auto;
        }

        .toggle-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin-left: auto;
            margin-right: auto;
        }

        /* Content frame styles */
        .content-frame {
            flex-grow: 1;
            height: 100vh;
            overflow: hidden;
            border: none;
        }


        input[type="checkbox"]:checked+label::after {
            transform: translateX(30px);
        }

        input[type="checkbox"]:checked+label {
            background-color: #333;
        }
    </style>
    <script src="/js/client-security.js"></script>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <div class="sidebar closed" id="sidebar">
            <button class="toggle-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <span class="dashboard-text">Dashboard</span>

            <!-- Home/Dashboard Link -->
            <a href="#" onclick="loadContent('dashboard.html', this)" data-bs-toggle="tooltip" title="Dashboard">
                <i class="fas fa-home"></i>
                <span class="link-text">Dashboard</span>
            </a>

            <a href="#" onclick="loadContent('/shield-report', this)" data-bs-toggle="tooltip" title="Browser Shield">
                <i class="fas fa-shield-alt"></i>
                <span class="link-text">Browser Shield</span>
            </a>

            <a href="#" onclick="loadContent('/risk-analysis', this)" data-bs-toggle="tooltip" title="Real Time Risk">
                <i class="fas fa-route"></i>
                <span class="link-text">Real Time Risk</span>
            </a>

            <a href="#" onclick="loadContent('/attack-detection', this)" data-bs-toggle="tooltip"
                title="Real Time DOM Risk">
                <i class="fas fa-clipboard-list"></i>
                <span class="link-text">Real Time DOM Risk</span>
            </a>

            <a href="#" onclick="loadContent('/rules', this)" data-bs-toggle="tooltip" title="Rules">
                <i class="fas fa-globe"></i>
                <span class="link-text">Rules</span>
            </a>

            <a href="#" onclick="loadContent('/rawreport', this)" data-bs-toggle="tooltip" title="Session Users">
                <i class="fas fa-user-clock"></i>
                <span class="link-text">Session Users</span>
            </a>

            <a href="#" onclick="loadContent('/session_journey', this)" data-bs-toggle="tooltip"
                title="Session Journey">
                <i class="fas fa-route"></i>
                <span class="link-text">Session Journey</span>
            </a>

            <a href="#" onclick="loadContent('/fingerprint-analysis', this)" data-bs-toggle="tooltip"
                title="Multi-Domain Analysis">
                <i class="fas fa-fingerprint"></i>
                <span class="link-text">Multi-Domain Analysis</span>
            </a>

            <a href="#" onclick="loadContent('/botrequests', this)" data-bs-toggle="tooltip" title="Bot Requests">
                <i class="fas fa-robot"></i>
                <span class="link-text">Bot Requests</span>
            </a>

            <a href="#" onclick="loadContent('/updated_session_risk_analysis', this)" data-bs-toggle="tooltip"
                title="updated_session_risk_analysis">
                <i class="fas fa-gavel"></i>
                <span class="link-text">Risk Analysis</span>
            </a>

            <a href="#" onclick="loadContent('/admin', this)" data-bs-toggle="tooltip" title="admin">
                <i class="fas fa-gavel"></i>
                <span class="link-text">Admin</span>
            </a>

            <a href="/logout" class="logout" data-bs-toggle="tooltip" title="Logout">
                <i class="fas fa-sign-out-alt"></i>
                <span class="link-text">Logout</span>
            </a>
        </div>

        <!-- Main Content Frame (using iframe for content) -->
        <iframe id="contentFrame" class="content-frame" src="dashboard.html" frameborder="0"></iframe>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js"></script>
    <script>
        // Initialize with loading the dashboard or last page
        // Initialize with loading the dashboard or last page
        document.addEventListener('DOMContentLoaded', function () {
            // Check for the login flag
            const isNewLogin = sessionStorage.getItem('newLogin');

            if (isNewLogin === 'true') {
                // Clear the flag
                sessionStorage.removeItem('newLogin');
                // Always go to dashboard on new login
                document.getElementById('contentFrame').src = 'dashboard.html';
                // Also clear any stored pages to reset navigation
                localStorage.removeItem('lastPage');
                localStorage.removeItem('lastPageWithParams');
            } else {
                // Get last page from localStorage (if exists)
                const lastPage = localStorage.getItem('lastPage');
                const lastPageWithParams = localStorage.getItem('lastPageWithParams');

                if (lastPage) {
                    // If there's a stored page, load it
                    document.getElementById('contentFrame').src = lastPageWithParams || lastPage;
                } else {
                    // Load dashboard by default
                    document.getElementById('contentFrame').src = 'dashboard.html';
                }
            }
        });

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('closed');
            sidebar.classList.toggle('open');
        }

        function loadContent(url, element) {
            // Store the page URL in localStorage for refresh handling
            localStorage.setItem('lastPage', url);

            // If the URL has parameters (from search form), save complete URL
            const contentFrame = document.getElementById('contentFrame');
            if (contentFrame.contentWindow && contentFrame.contentWindow.location.search) {
                // Check if we're on the same base URL but with different parameters
                const currentUrl = contentFrame.contentWindow.location.pathname;
                if (currentUrl === url) {
                    // Keep the current URL with its parameters
                    localStorage.setItem('lastPageWithParams', currentUrl + contentFrame.contentWindow.location.search);
                } else {
                    // New URL, clear parameters
                    localStorage.setItem('lastPageWithParams', url);
                }
            } else {
                // Simple URL without parameters
                localStorage.setItem('lastPageWithParams', url);
            }

            // Update iframe source
            contentFrame.src = url;
            disableTooltip(element);
        }

        // When the iframe content changes, capture and save the full URL with parameters
        document.getElementById('contentFrame').addEventListener('load', function () {
            if (this.contentWindow && this.contentWindow.location.href) {
                const fullUrl = this.contentWindow.location.pathname + this.contentWindow.location.search;
                if (fullUrl && !fullUrl.includes('dashboard.html')) {
                    localStorage.setItem('lastPageWithParams', fullUrl);
                }
            }
        });

        function disableTooltip(element) {
            const tooltip = bootstrap.Tooltip.getInstance(element);
            if (tooltip) {
                tooltip.dispose();
                element.setAttribute('title', '');
                element.removeAttribute('data-bs-original-title');
            }
        }

        // Initialize tooltips
        document.addEventListener('DOMContentLoaded', function () {
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });
        });
    </script>
</body>

</html>
