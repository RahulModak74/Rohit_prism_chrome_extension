<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Chat Interface</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="/css/common.css" />
  <style>
    body {
      background-color: #f0f0f0;
      color: #333;
    }
    .container {
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    header {
      background-color: #007bff;
      color: white;
      padding: 10px 0;
      text-align: center;
      font-weight: bold;
    }
    .fingerprint-cell {
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pagination-controls {
      margin: 10px 0;
    }
    .page-jump input {
      width: 60px;
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <div class="container mt-3">
    <header>Nudging Page</header>

    <form id="messageForm" class="mt-3">
      <div class="mb-3">
        <label for="sessionId" class="form-label">Session ID:</label>
        <input type="text" class="form-control" id="sessionId" name="sessionId" required />
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message:</label>
        <input type="text" class="form-control" id="message" name="message" required />
      </div>
      <button type="submit" class="btn btn-primary">Send Message</button>
    </form>

    <div id="sessionsDisplay" class="mt-3">
      <strong>Active Sessions:</strong> <span id="sessionsList">Loading...</span>
    </div>
  </div>

  <div class="container mt-4">
    <form id="adminForm" class="row g-3">
      <div class="col-md-4">
        <label for="custom_url" class="form-label">Enter Custom URL:</label>
        <input type="text" class="form-control" id="custom_url" name="custom_url" />
      </div>
      <div class="col-md-3">
        <label for="start_date" class="form-label">Start Date</label>
        <input type="date" class="form-control" id="start_date" name="start_date" />
      </div>
      <div class="col-md-3">
        <label for="end_date" class="form-label">End Date</label>
        <input type="date" class="form-control" id="end_date" name="end_date" />
      </div>
      <div class="col-md-2 d-flex align-items-end">
        <button type="submit" class="btn btn-primary me-2">Search</button>
        <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
      </div>
    </form>

    <!-- Loading, table, messages -->
    <div id="loadingIndicator" class="text-center mt-4" style="display: none;">
      <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
      <p>Loading data...</p>
    </div>

    <div id="noDataMessage" class="text-center mt-4" style="display: none;">
      <i class="fas fa-info-circle" style="font-size: 24px; color: #007bff;"></i>
      <p>No visitors found.</p>
    </div>

    <div id="errorMessage" class="text-center mt-4" style="display: none; color: #dc3545;">
      <i class="fas fa-exclamation-triangle"></i>
      <p id="errorText">An error occurred.</p>
    </div>

    <div class="table-responsive mt-3">
      <table id="visitorsTable" class="table table-bordered" style="display: none;">
        <thead class="table-success">
          <tr>
            <th>Session ID</th>
            <th>Fingerprint Id</th>
            <th>Date of visit</th>
            <th>Time of visit</th>
            <th>Country</th>
            <th>Region</th>
            <th>City</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div id="pagination" class="mt-3"></div>
  </div>

  <script>
    window.onload = function () {
      const urlParams = new URLSearchParams(window.location.search);
      const customUrl = urlParams.get('custom_url');
      const startDate = urlParams.get('start_date');
      const endDate = urlParams.get('end_date');
      const page = urlParams.get('page') || 1;

      if (customUrl) document.getElementById('custom_url').value = customUrl;
      if (startDate) document.getElementById('start_date').value = startDate;
      if (endDate) document.getElementById('end_date').value = endDate;

      fetchAdminData(customUrl || '', startDate || '', endDate || '', page);

      document.getElementById('adminForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const cu = document.getElementById('custom_url').value.trim();
        const sd = document.getElementById('start_date').value;
        const ed = document.getElementById('end_date').value;
        const params = new URLSearchParams();
        if (cu) params.append('custom_url', cu);
        if (sd) params.append('start_date', sd);
        if (ed) params.append('end_date', ed);
        params.append('page', 1);
        window.history.pushState({}, '', '/admin?' + params.toString());
        fetchAdminData(cu, sd, ed, 1);
      });

      document.getElementById('resetBtn').addEventListener('click', () => {
        document.getElementById('custom_url').value = '';
        document.getElementById('start_date').value = '';
        document.getElementById('end_date').value = '';
        window.history.pushState({}, '', '/admin');
        fetchAdminData('', '', '', 1);
      });

      document.getElementById('messageForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const sid = document.getElementById('sessionId').value.trim();
        const msg = document.getElementById('message').value.trim();
        fetch('/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: sid, message: msg })
        }).then(r => {
          if (r.ok) alert('Message sent!');
          else alert('Failed to send message.');
        });
      });
    };

    function fetchAdminData(customUrl, startDate, endDate, page) {
      let url = `/api/admin?page=${page}`;
      if (customUrl) url += `&custom_url=${encodeURIComponent(customUrl)}`;
      if (startDate) url += `&start_date=${startDate}`;
      if (endDate) url += `&end_date=${endDate}`;

      // Show loading
      document.getElementById('loadingIndicator').style.display = 'block';
      document.getElementById('visitorsTable').style.display = 'none';
      document.getElementById('noDataMessage').style.display = 'none';
      document.getElementById('errorMessage').style.display = 'none';

      fetch(url)
        .then(r => r.json())
        .then(data => {
          document.getElementById('loadingIndicator').style.display = 'none';
          if (data.success) {
            // Update form fields
            document.getElementById('custom_url').value = data.custom_url;
            document.getElementById('start_date').value = data.start_date;
            document.getElementById('end_date').value = data.end_date;

            // Update sessions list
            document.getElementById('sessionsList').textContent = data.sessions.length ? data.sessions.join(', ') : 'None';

            if (data.visitors && data.visitors.length > 0) {
              renderTable(data.visitors);
              document.getElementById('visitorsTable').style.display = 'table';
              renderPagination(data.currentPage, data.totalPages, data.custom_url, data.start_date, data.end_date);
            } else {
              document.getElementById('noDataMessage').style.display = 'block';
              document.getElementById('pagination').innerHTML = '';
            }
          } else {
            document.getElementById('errorText').textContent = data.message || 'Error loading data.';
            document.getElementById('errorMessage').style.display = 'block';
            document.getElementById('pagination').innerHTML = '';
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById('loadingIndicator').style.display = 'none';
          document.getElementById('errorText').textContent = 'Network error: ' + err.message;
          document.getElementById('errorMessage').style.display = 'block';
        });
    }

    function renderTable(visitors) {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      visitors.forEach(row => {
        const tr = document.createElement('tr');
        // Adjust time (as in EJS)
        let adjustedTime = row.time;
        if (row.time) {
          const [h, m, s] = row.time.split(':').map(Number);
          const d = new Date(row.date);
          d.setHours(d.getHours() + h + 4);
          d.setMinutes(d.getMinutes() + m + 30);
          adjustedTime = d.toTimeString().split(' ')[0];
        }

        tr.innerHTML = `
          <td><a href="/session_journey?session_id=${encodeURIComponent(row.session_id)}">${escapeHTML(row.session_id)}</a></td>
          <td class="fingerprint-cell">${escapeHTML(row.fingerprint_id)}</td>
          <td>${escapeHTML(row.date)}</td>
          <td>${escapeHTML(adjustedTime)}</td>
          <td>${escapeHTML(row.country)}</td>
          <td>${escapeHTML(row.region)}</td>
          <td>${escapeHTML(row.city)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPagination(currentPage, totalPages, customUrl, startDate, endDate) {
      const div = document.getElementById('pagination');
      div.innerHTML = '';
      if (totalPages <= 1) return;

      currentPage = parseInt(currentPage);
      const max = 5;
      let start = Math.max(1, currentPage - Math.floor(max / 2));
      let end = Math.min(totalPages, start + max - 1);
      if (end - start + 1 < max) start = Math.max(1, end - max + 1);

      const controls = document.createElement('div');
      controls.className = 'pagination-controls d-flex flex-wrap justify-content-center align-items-center gap-1';

      if (currentPage > 1) {
        const prev = document.createElement('a');
        prev.href = '#';
        prev.className = 'btn btn-sm btn-outline-primary';
        prev.textContent = '«';
        prev.onclick = e => { e.preventDefault(); goToPage(currentPage - 1); };
        controls.appendChild(prev);
      }

      for (let i = start; i <= end; i++) {
        const a = document.createElement('a');
        a.href = '#';
        a.className = `btn btn-sm ${i === currentPage ? 'btn-primary' : 'btn-outline-primary'}`;
        a.textContent = i;
        a.onclick = e => { e.preventDefault(); goToPage(i); };
        controls.appendChild(a);
      }

      if (currentPage < totalPages) {
        const next = document.createElement('a');
        next.href = '#';
        next.className = 'btn btn-sm btn-outline-primary';
        next.textContent = '»';
        next.onclick = e => { e.preventDefault(); goToPage(currentPage + 1); };
        controls.appendChild(next);
      }

      const jump = document.createElement('div');
      jump.className = 'ms-3 d-flex align-items-center';
      jump.innerHTML = `
        <span class="me-2">Go to page:</span>
        <input type="number" min="1" max="${totalPages}" value="${currentPage}" class="form-control form-control-sm" style="width:70px;" id="pageInput" />
        <button class="btn btn-sm btn-outline-secondary ms-1" id="goBtn">Go</button>
      `;
      jump.querySelector('#goBtn').onclick = () => {
        const p = parseInt(jump.querySelector('#pageInput').value);
        if (p >= 1 && p <= totalPages) goToPage(p);
      };

      controls.appendChild(jump);
      div.appendChild(controls);
    }

    function goToPage(page) {
      const cu = document.getElementById('custom_url').value.trim();
      const sd = document.getElementById('start_date').value;
      const ed = document.getElementById('end_date').value;
      let url = `/admin?page=${page}`;
      if (cu) url += `&custom_url=${encodeURIComponent(cu)}`;
      if (sd) url += `&start_date=${sd}`;
      if (ed) url += `&end_date=${ed}`;
      window.history.pushState({}, '', url);
      fetchAdminData(cu, sd, ed, page);
    }

    function escapeHTML(text) {
      if (!text) return '';
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '<')
        .replace(/>/g, '>')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
